# Test phase: only the database and the API run in Docker.
# The two Next.js apps (web, admin) run with pnpm/npm on your PC.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qic}
      POSTGRES_DB: qic
    volumes:
      - qic-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qic -d qic"]
      interval: 5s
      timeout: 3s
      retries: 10
    # not published to the host on purpose: only the api container can reach it

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: ${ENV:-dev}
      ROLE: both
      DATABASE_URL: postgresql+asyncpg://qic:${POSTGRES_PASSWORD:-qic}@db:5432/qic
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      SAMPLES_DIR: /samples
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@gmail.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin}
      RETENTION_MINUTES: ${RETENTION_MINUTES:-60}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
    ports:
      - "8000:8000"
    volumes:
      - qic-data:/data
      # Real sample files for the selfcheck (RAW, PSD, HEIC). Drop files into api/data/samples/<slug>/
      - ./api/data/samples:/samples:ro
    mem_limit: 3g

volumes:
  qic-pgdata:
  qic-data:
